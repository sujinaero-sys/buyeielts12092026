<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUYE IELTS Report</title></head><body><button class="theme" id="themeBtn">🌙 Dark mode</button><main style="max-width:700px;margin:50px auto;font-family:system-ui"><h1>BUYE IELTS Performance Report</h1><div id=o></div><p><a href="practice.html">Back to Mock Centre</a></p><script>let x=JSON.parse(localStorage.getItem('buye2i_latest')||'null');document.querySelector('#o').innerHTML=x?`<h2>Estimated band: ${x.band}</h2><p>Score: ${x.score}/40</p><p>Section: ${x.section.replaceAll('_',' ')}</p><p>Recorded: ${new Date(x.at).toLocaleString()}</p>`:'<p>No completed section yet.</p>'</script></main></body></html><script>(function(){let k="buye_theme";if(localStorage.getItem(k)==="dark")document.body.classList.add("dark");let b=document.querySelector("#themeBtn");b&&b.addEventListener("click",()=>{document.body.classList.toggle("dark");localStorage.setItem(k,document.body.classList.contains("dark")?"dark":"light");b.textContent=document.body.classList.contains("dark")?"☀️ Light mode":"🌙 Dark mode"});})();</script>
